
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Quarto | Sistema de Reservas</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- Menu superior -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/quartos}">
            Sistema de Reservas
        </a>
    </div>
</nav>

<main class="container py-5">

    <!-- Título da página -->
    <div class="mb-4">
        <h1 class="h3 mb-1">Cadastro de Quarto</h1>

        <p class="text-secondary mb-0">
            Preencha os dados do quarto para cadastrá-lo no sistema.
        </p>
    </div>

    <!-- Formulário -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form th:action="@{/quartos/salvar}"
                  th:object="${quarto}"
                  method="post">

                <!-- Número e tipo -->
                <div class="row g-3 mb-3">

                    <div class="col-md-4">
                        <label for="numero" class="form-label">
                            Número do quarto
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="numero"
                                th:field="*{numero}"
                                th:errorclass="is-invalid"
                                placeholder="Ex.: 101"
                                required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('numero')}"
                             th:errors="*{numero}">
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label for="tipo" class="form-label">
                            Tipo de quarto
                        </label>

                        <select
                                class="form-select"
                                id="tipo"
                                th:field="*{tipo}"
                                th:errorclass="is-invalid"
                                required>

                            <option value="">Selecione o tipo</option>
                            <option value="Standard">Standard</option>
                            <option value="Luxo">Luxo</option>
                            <option value="Suite">Suíte</option>
                            <option value="Familiar">Familiar</option>
                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('tipo')}"
                             th:errors="*{tipo}">
                        </div>
                    </div>

                </div>

                <!-- Capacidade e diária -->
                <div class="row g-3 mb-4">

                    <div class="col-md-6">
                        <label for="capacidade" class="form-label">
                            Capacidade de hóspedes
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="capacidade"
                                th:field="*{capacidade}"
                                th:errorclass="is-invalid"
                                min="1"
                                placeholder="Ex.: 2"
                                required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('capacidade')}"
                             th:errors="*{capacidade}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="diaria" class="form-label">
                            Valor da diária (R$)
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                id="diaria"
                                th:field="*{diaria}"
                                th:errorclass="is-invalid"
                                min="0.01"
                                step="0.01"
                                placeholder="Ex.: 180.00"
                                required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('diaria')}"
                             th:errors="*{diaria}">
                        </div>
                    </div>

                </div>

                <hr class="mb-4">

                <!-- Botões -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/quartos}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Salvar quarto
                    </button>

                </div>

            </form>

        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
