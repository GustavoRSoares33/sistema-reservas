
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quartos | Sistema de Reservas</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/quartos}">
            Sistema de Reservas
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Quartos</h1>
            <p class="text-secondary mb-0">
                Gerencie os quartos do hotel.
            </p>
        </div>

        <a th:href="@{/quartos/novo}"
           class="btn btn-primary">
            + Novo quarto
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <p th:if="${#lists.isEmpty(quartos)}"
               class="text-secondary mb-0">
                Nenhum quarto cadastrado.
            </p>

            <div class="table-responsive"
                 th:if="${not #lists.isEmpty(quartos)}">

                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Capacidade</th>
                        <th>Diária</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="quarto : ${quartos}">
                        <td th:text="${quarto.id}"></td>
                        <td th:text="${quarto.numero}"></td>
                        <td th:text="${quarto.tipo}"></td>
                        <td th:text="${quarto.capacidade}"></td>
                        <td th:text="${#numbers.formatDecimal(quarto.diaria, 1, 2)}"></td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</main>

</body>
</html>
